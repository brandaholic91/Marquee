<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8" />
<title>Marquee — orchestration UI prototype</title>
<meta name="viewport" content="width=1440" />
<link rel="preconnect" href="https://fonts.googleapis.com" />
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
<link href="https://fonts.googleapis.com/css2?family=Source+Serif+4:opsz,wght@8..60,400;8..60,500;8..60,600&family=Inter:wght@400;500;600&family=JetBrains+Mono:wght@400;500&display=swap" rel="stylesheet" />
<link rel="stylesheet" href="tokens.css" />

<script src="https://unpkg.com/react@18.3.1/umd/react.development.js" integrity="sha384-hD6/rw4ppMLGNu3tX5cjIb+uRZ7UkRJ6BPkLpg4hAu/6onKUg4lLsHAs9EBPT82L" crossorigin="anonymous"></script>
<script src="https://unpkg.com/react-dom@18.3.1/umd/react-dom.development.js" integrity="sha384-u6aeetuaXnQ38mYT8rp6sbXaQe3NL9t+IBXmnYxwkUI2Hw4bsp2Wvmx4yRQF1uAm" crossorigin="anonymous"></script>
<script src="https://unpkg.com/@babel/standalone@7.29.0/babel.min.js" integrity="sha384-m08KidiNqLdpJqLq95G/LEi8Qvjl/xUYll3QILypMoQ65QorJ9Lvtp2RXYGBFj1y" crossorigin="anonymous"></script>
</head>
<body>
<div id="root"></div>

<template id="__bundler_thumbnail">
  <svg viewBox="0 0 200 200" xmlns="http://www.w3.org/2000/svg">
    <rect width="200" height="200" fill="#EFE8DA" />
    <text x="100" y="115" text-anchor="middle" font-family="JetBrains Mono, monospace" font-size="22" fill="#2A2824" letter-spacing="3">MARQUEE</text>
    <circle cx="100" cy="60" r="6" fill="#E89A2C" />
  </svg>
</template>

<script type="text/babel" src="shared.jsx"></script>
<script type="text/babel" src="screens/onboarding.jsx"></script>
<script type="text/babel" src="screens/home.jsx"></script>
<script type="text/babel" src="screens/chat.jsx"></script>
<script type="text/babel" src="screens/deliverable.jsx"></script>
<script type="text/babel" src="screens/memory.jsx"></script>

<script type="text/babel" data-presets="env,react">
  const { useState, useEffect } = React;

  function App() {
    const [hash, setHash] = useState(window.location.hash || '#/onboarding');
    useEffect(() => {
      const onHash = () => setHash(window.location.hash || '#/onboarding');
      window.addEventListener('hashchange', onHash);
      return () => window.removeEventListener('hashchange', onHash);
    }, []);

    let Screen;
    switch (hash) {
      case '#/onboarding':  Screen = window.OnboardingScreen; break;
      case '#/home':        Screen = window.HomeScreen; break;
      case '#/chat':        Screen = window.ChatScreen; break;
      case '#/deliverable': Screen = window.DeliverableScreen; break;
      case '#/memory':      Screen = window.MemoryScreen; break;
      default:              Screen = window.OnboardingScreen;
    }

    const screenLabels = {
      '#/onboarding':  '01 Onboarding',
      '#/home':        '02 Home',
      '#/chat':        '03 Chat',
      '#/deliverable': '04 Deliverable',
      '#/memory':      '05 Memory',
    };

    return (
      <div data-screen-label={screenLabels[hash] || '01 Onboarding'}>
        <window.RouteBar current={hash} />
        {Screen ? <Screen /> : null}
      </div>
    );
  }

  ReactDOM.createRoot(document.getElementById('root')).render(<App />);
</script>
</body>
</html>
